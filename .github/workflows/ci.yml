name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SERVICE_URL: http://localhost:5000
      AUTH_SYSTEM_CODE: HORARIOS_FISI
      AUTH_SESSION_SECRET: test_ci_auth_session_secret_fisi_32_chars
      DIRECTION_ACCESS_CODE: ci-direction-code
      DIRECTION_EMAIL_ALLOWLIST: direccion@unmsm.edu.pe
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check
